[package]
name = "fincontrol"
# Espelho do VERSION da raiz (como frontend/package.json): quem sobe a versao
# roda ./scripts/versao.sh, que sincroniza os dois. Nao editar a mao.
version = "1.2.1"
description = "FinControl — controle financeiro pessoal (cliente Tauri)"
edition = "2021"

# main.rs chama fincontrol_lib::run(); sem crate-type: o desktop so usa rlib.
[lib]
name = "fincontrol_lib"

# O Rust deste crate eh a casca do Tauri: janela, cofre e o backend embutido
# (sidecar FastAPI empacotado pelo PyInstaller em bundle.resources, ver
# src/sidecar.rs). A regra de negocio continua no React e no FastAPI.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Cofre de segredos do aparelho (Keychain / Credential Manager / Secret Service).
# Os backends são escolhidos por target: apple-native (macOS/iOS), windows-native
# e sync-secret-service (Linux, com o crypto-rust).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Biometria do sistema: Touch ID (macOS), Windows Hello, Face ID/digital (mobile).
tauri-plugin-biometry = "0.2.8"
# Atualização assinada: baixa o pacote do repo público de releases e confere a
# assinatura contra a pubkey do tauri.conf.json. A chave privada só existe no CI.
tauri-plugin-updater = "2"
# Necessário para reiniciar o app depois de instalar a atualização.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Instância única: um segundo clique foca a janela aberta em vez de subir outro
# sidecar no mesmo banco. 2.4.x é a última linha que aceita tauri 2.11 (a 2.5
# exige tauri ^2.12, e o CLI npm está fixo em 2.11).
tauri-plugin-single-instance = "=2.4.5"
# Token de sessão e segredos do sidecar (gerados no aparelho, guardados no cofre).
getrandom = "0.3"
# Chave Fernet = 32 bytes em base64 urlsafe com padding.
base64 = "0.22"
# Prova de prontidão do sidecar: HMAC-SHA256(token, nonce) devolvido pelo
# /api/health, sem o token trafegar no pedido.
hmac = "0.12"
sha2 = "0.10"

# Job Object com KILL_ON_JOB_CLOSE: se o app morrer (até `taskkill /F`), o
# Windows mata o sidecar junto. CREATE_NO_WINDOW vem de System_Threading.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
