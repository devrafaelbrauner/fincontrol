apply plugin: 'com.android.application'

// Chaquopy (backend Python no APK, sabor `local`). O plugin vale para o módulo inteiro, sem
// opção por sabor: o que ele põe no `api` aqui é movido para o `local` lá embaixo, junto
// com o desligamento das tarefas dele no `nuvem`.
def apiAntesDoChaquopy = configurations.api.dependencies.toList()
apply plugin: 'com.chaquo.python'
def depsDoChaquopy = configurations.api.dependencies.findAll { !(it in apiAntesDoChaquopy) }
apply plugin: 'org.jetbrains.kotlin.android'  // casca do sabor `local` (src/local/java, Kotlin)

// --- Assinatura de release -------------------------------------------------
//
// As credenciais NUNCA entram no repositório: ficam em
// ~/.fincontrol-keys/keystore.properties, junto da própria keystore. O caminho
// é sobreponível por FINCONTROL_KEYSTORE_PROPERTIES para o dia em que outra
// máquina precisar buildar.
//
// Perder a keystore não apaga dados aqui — o FinControl não guarda nada
// financeiro no aparelho, o servidor é a fonte de verdade —, mas apaga a
// possibilidade de ATUALIZAR o app por cima: o Android recusa um APK cuja
// assinatura mudou (INSTALL_FAILED_UPDATE_INCOMPATIBLE), e a única saída é
// desinstalar. Faça backup dos dois arquivos.
def caminhoProps = System.getenv("FINCONTROL_KEYSTORE_PROPERTIES") ?:
        "${System.getProperty('user.home')}/.fincontrol-keys/keystore.properties"
def arquivoProps = file(caminhoProps)
def temAssinatura = arquivoProps.exists()
def propsAssinatura = new Properties()
if (temAssinatura) {
    arquivoProps.withInputStream { propsAssinatura.load(it) }
}

// Falhar alto quando faltar a chave, em vez de deixar sair um APK sem
// assinatura. Sem isto o gradle entrega `app-release-unsigned.apk` sem reclamar,
// e o problema só aparece no aparelho — na hora de instalar, ou pior, meses
// depois na hora de atualizar. Assinatura descartável é pior que build vermelho.
//
// A checagem vive no taskGraph, e não aqui fora, porque este bloco é avaliado em
// TODO build: fazê-la direto abortaria também o `assembleDebug`, que não precisa
// de chave nenhuma. Só o release do sabor `nuvem` (o app de verdade) pede a chave —
// `assembleRelease` inclui ele; o `local` assina com a chave de debug. Olha só as
// tarefas deste módulo: as das bibliotecas (ex.: packageReleaseResources do
// capacitor-android) entram em qualquer build de release, inclusive o do `local`.
gradle.taskGraph.whenReady { grafo ->
    def pedeRelease = grafo.allTasks.any {
        it.project == project && it.name ==~ /(?i)(assemble|bundle|package|install)(Nuvem)?Release.*/
    }
    if (pedeRelease && !temAssinatura) {
        throw new GradleException(
            "Build de release sem keystore.\n" +
            "  Esperava as credenciais em: ${caminhoProps}\n" +
            "  Gere a chave e o arquivo com: cd frontend && npm run apk:release\n" +
            "  (ou aponte FINCONTROL_KEYSTORE_PROPERTIES para outro lugar)")
    }
}

// `versionName` é o texto que a pessoa vê; sai do package.json para não existir
// uma segunda versão do app divergindo em silêncio da do frontend.
def versaoWeb = new groovy.json.JsonSlurper().parse(file("../../package.json")).version

android {
    namespace = "com.rafaelbrauner.fincontrol"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rafaelbrauner.fincontrol"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.property("fincontrolVersionCode").toInteger()
        versionName versaoWeb
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (temAssinatura) {
                storeFile file(propsAssinatura['storeFile'])
                storePassword propsAssinatura['storePassword']
                keyAlias propsAssinatura['keyAlias']
                keyPassword propsAssinatura['keyPassword']
            }
        }
    }

    // Sabores, lado a lado até o corte do programa android-local:
    // - nuvem: o APK de hoje (mesmo applicationId, assinatura e comportamento);
    // - local: backend Python embutido (Chaquopy), com pacote e nome próprios para
    //   instalar ao lado do nuvem. Assina com a chave de debug: nada dele vai ao usuário.
    // abiFilters em toda variante porque o Chaquopy os exige (lê só defaultConfig e
    // sabores, não buildType); o APK nuvem não tem .so, então o filtro não muda nada nele.
    flavorDimensions = ["modo"]
    productFlavors {
        nuvem {
            dimension "modo"
            // Sem chave, o sabor fica sem assinatura só para o bloco configurar; quem
            // barra o build nesse caso é o taskGraph lá em cima, com uma mensagem que
            // diz o que fazer — aqui o gradle diria apenas "unsigned".
            if (temAssinatura) {
                signingConfig signingConfigs.release
            }
            ndk { abiFilters "arm64-v8a" }
        }
        local {
            dimension "modo"
            applicationIdSuffix ".local"
            signingConfig signingConfigs.debug
            // Celulares atuais (e o emulador do Apple silicon); a wheel x86_64 do
            // pydantic-core serve a um emulador x86_64, acrescentando "x86_64" aqui.
            ndk { abiFilters "arm64-v8a" }
        }
    }

    buildTypes {
        release {
            // A assinatura de release mora no sabor `nuvem` (o `local` usa a de debug).
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Pacote e nome próprios para o APK de teste conviver com o app de
            // verdade no mesmo aparelho. Sem isto os dois têm o mesmo
            // applicationId: instalar um SUBSTITUI o outro em silêncio, os dois
            // aparecem como "FinControl" na gaveta, e não há como saber pelo
            // celular qual backend o app instalado usa.
            // O nome vem de src/debug/res/values/strings.xml — `resValue` aqui
            // colidiria com o app_name já declarado no res/ principal.
            applicationIdSuffix ".teste"
        }
    }

    // O plugin do Kotlin põe este metadado de build no APK de release: fora, para o
    // `nuvem` sair com o mesmo conteúdo de antes dos sabores.
    packaging {
        resources {
            excludes += ["kotlin-tooling-metadata.json"]
        }
    }
}

// Kotlin no mesmo alvo do Java (21, que vem do capacitor.build.gradle).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

// --- Python do sabor `local` (Chaquopy) --------------------------------------
// Fonte: cópia de backend/app gerada no build/ (o Chaquopy empacota o diretório de fonte
// inteiro; apontá-lo para backend/ levaria testes, banco de dev e uploads). Lista branca:
// só `.py`, `migrations/*.sql` e o VERSION da raiz, ao lado de `app/` (é de lá que o
// `versao.py` o lê no APK); um banco de dev ou um `.env` largado em backend/app não entra.
// Dependências: o lock backend/requirements-android.txt, com o pydantic-core das wheels em
// wheels/ (o pip do Chaquopy só aceita wheel). Python do build: o `python3.13` do PATH.
def fonteBackend = layout.buildDirectory.dir("backend-local")
def copiarBackend = tasks.register("copiarBackendLocal", Sync) {
    from(rootProject.file("../../backend/app")) {
        include "**/*.py", "migrations/*.sql"
        into "app"
    }
    from(rootProject.file("../../VERSION"))
    into fonteBackend
    includeEmptyDirs = false  // sem os __pycache__/ vazios
}

// As wheels de wheels/ entram no APK pelo `--find-links` do pip, e o lock não tem --hash:
// conferir o SHA256SUMS aqui vale para todo build do `local`, não só pelo apk-local.sh. Hash
// diferente, arquivo listado e ausente ou .whl fora da lista (o pip o acharia) = build
// vermelho antes do pip. Sem outputs declarados: roda sempre (são poucos MB).
def conferirWheels = tasks.register("conferirWheelsLocal") {
    def pasta = file("wheels")
    doLast {
        def somas = new File(pasta, "SHA256SUMS")
        if (!somas.isFile()) {
            throw new GradleException("wheels/SHA256SUMS não existe: sem ele as wheels não entram no APK.")
        }
        def listadas = [:]
        somas.eachLine { linha ->
            if (!linha.trim()) return
            def m = linha =~ /([0-9a-f]{64}) [ *](\S+)/
            if (!m.matches()) {
                throw new GradleException("wheels/SHA256SUMS: linha fora do formato do shasum: ${linha}")
            }
            listadas[m.group(2)] = m.group(1)
        }
        def problemas = []
        listadas.each { nome, esperado ->
            def arquivo = new File(pasta, nome)
            if (!arquivo.isFile()) {
                problemas << "${nome}: está no SHA256SUMS e não na pasta"
                return
            }
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            arquivo.withInputStream { entrada ->
                byte[] bloco = new byte[65536]
                int lidos
                while ((lidos = entrada.read(bloco)) != -1) {
                    digest.update(bloco, 0, lidos)
                }
            }
            def real = digest.digest().encodeHex().toString()
            if (real != esperado) {
                problemas << "${nome}: sha256 ${real}, o SHA256SUMS diz ${esperado}"
            }
        }
        pasta.listFiles().findAll { it.name.endsWith(".whl") && !listadas.containsKey(it.name) }.each {
            problemas << "${it.name}: wheel fora do SHA256SUMS"
        }
        if (problemas) {
            throw new GradleException(
                "As wheels de android/app/wheels não conferem com o SHA256SUMS:\n  " + problemas.join("\n  "))
        }
    }
}

chaquopy {
    productFlavors {
        local {
            version = "3.13"
            pip {
                options "--find-links", "wheels"
                install "-r", "../../../backend/requirements-android.txt"
            }
        }
    }
    sourceSets {
        local {
            srcDir fonteBackend
        }
    }
}

tasks.named { it ==~ /mergeLocal(Debug|Release)PythonSources/ }.configureEach {
    dependsOn copiarBackend
}
tasks.named { it ==~ /installLocal(Debug|Release)PythonRequirements/ }.configureEach {
    dependsOn conferirWheels
}

// Nada de Python no `nuvem`: as tarefas do Chaquopy dele não rodam (sem libpython nem
// assets de Python no APK) e o jar do runtime Java do Chaquopy vai só para o `local`.
tasks.named { it ==~ /\w+Nuvem(Debug|Release)Python\w*/ }.configureEach {
    enabled = false
}
configurations.api.dependencies.removeAll(depsDoChaquopy)
depsDoChaquopy.each { dependencies.add("localApi", it) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
