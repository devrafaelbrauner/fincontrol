name: Release

# Binários assinados do app desktop. O código fica neste repo; os artefatos e o
# `latest.json` (consumido pelo updater) vão para o repo de releases.
# Dispara numa tag `v*` ou manualmente. NÃO republica uma tag existente por
# acidente: use workflow_dispatch apenas para uma versão nova.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes de tag simultâneos disputariam o latest.json — serializa por ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASES_REPO: devrafaelbrauner/fincontrol-releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            # `app` gera o `*.app.tar.gz` (+ `.sig`) do updater; `dmg` instala.
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
    runs-on: ${{ matrix.os }}
    # A chave privada de assinatura do updater vive SÓ nos GitHub Secrets e entra
    # SÓ nos dois passos `tauri build` abaixo: nem o `npm ci`, nem as actions de
    # terceiros, nem o `pip install` a recebem, e o job `release` (que publica)
    # nunca a vê. Dentro do `tauri build` o cargo ainda repassa o env aos `build.rs`.
    # A pubkey correspondente está no tauri.conf.json (minisign).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: frontend/src-tauri -> target

      - run: npm ci

      # Backend embutido (sidecar): PyInstaller onedir em src-tauri/sidecar-dist/, que o
      # tauri.conf.json leva em bundle.resources. Precisa existir antes do `tauri build`.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt

      - name: Build do backend (PyInstaller)
        working-directory: .
        shell: bash
        run: |
          python -m pip install -r backend/requirements-desktop.txt
          pyinstaller backend/desktop.spec --noconfirm --distpath frontend/src-tauri/sidecar-dist --workpath backend/build/pyinstaller

      # Smoke do executável congelado: sobe com segredos descartáveis (gerados aqui, nunca
      # um secret do repo), espera o /api/health, confere a prova HMAC do nonce (o health
      # nunca recebe o token), 401 sem o token local e 200 com ele, e fecha o stdin, que
      # deve encerrá-lo.
      - name: Smoke do backend (/api/health, prova e token)
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          exe=frontend/src-tauri/sidecar-dist/fincontrol-backend/fincontrol-backend
          [ -f "$exe.exe" ] && exe="$exe.exe"
          porta=$(python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")
          dados=$(mktemp -d)
          command -v cygpath > /dev/null && dados=$(cygpath -m "$dados")  # Windows: caminho nativo para o .exe
          linha=$(python -c "import base64, json, os, secrets; print(json.dumps({'secret_key': secrets.token_hex(32), 'fernet_key': base64.urlsafe_b64encode(os.urandom(32)).decode(), 'token': secrets.token_hex(32)}))")
          # O stdin é um pipe que fica aberto até existir "$dados/fim" (sem FIFO: vale no Git Bash).
          trap 'touch "$dados/fim"' EXIT
          { echo "$linha"; while [ ! -f "$dados/fim" ]; do sleep 0.1; done; } \
            | { set +e; FINCONTROL_DATA="$dados/app-data" FINCONTROL_PORTA="$porta" FINCONTROL_AGENDADOR=0 FINCONTROL_MODO=desktop "$exe"; echo "$?" > "$dados/saiu"; } &
          inicio=$SECONDS
          until curl -fs "http://127.0.0.1:$porta/api/health" > "$dados/health"; do
            [ -f "$dados/saiu" ] && { echo "o backend saiu antes de ficar pronto"; exit 1; }
            [ $((SECONDS - inicio)) -ge 30 ] && { echo "/api/health não respondeu em 30 s"; exit 1; }
            sleep 0.2
          done
          grep -q '"ok":true' "$dados/health"
          echo "pronto em ~$((SECONDS - inicio)) s"
          # `end=''`: no Windows o print sairia com \r\n, e o \r grudaria no valor capturado.
          token=$(python -c "import json, sys; print(json.loads(sys.argv[1])['token'], end='')" "$linha")
          nonce=$(python -c "import secrets; print(secrets.token_hex(16), end='')")
          curl -fs -H "X-FinControl-Nonce: $nonce" "http://127.0.0.1:$porta/api/health" > "$dados/prova"
          python -c "import hashlib, hmac, json, sys; corpo = json.load(open(sys.argv[3])); esperado = hmac.new(sys.argv[1].encode(), sys.argv[2].encode(), hashlib.sha256).hexdigest(); sys.exit(0 if corpo == {'ok': True, 'prova': esperado} else 'a prova do /api/health não confere')" "$token" "$nonce" "$dados/prova"
          sem_token=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$porta/api/auth/status")
          [ "$sem_token" = "401" ] || { echo "/api/auth/status sem token: $sem_token (esperado 401)"; exit 1; }
          com_token=$(curl -s -o /dev/null -w '%{http_code}' -H "X-FinControl-Token: $token" "http://127.0.0.1:$porta/api/auth/status")
          [ "$com_token" = "200" ] || { echo "/api/auth/status com token: $com_token (esperado 200)"; exit 1; }
          echo "guarda ok: prova HMAC confere, 401 sem token e 200 com token"
          touch "$dados/fim"  # fecha o stdin: o backend tem de sair em até 3 s
          for _ in $(seq 1 40); do [ -f "$dados/saiu" ] && break; sleep 0.1; done
          [ -f "$dados/saiu" ] || { echo "o backend não saiu com o EOF do stdin"; exit 1; }
          echo "sidecar ok: /api/health 200 com prova, token exigido e saída $(cat "$dados/saiu") com o EOF"

      # macOS: `.dmg` para instalar + `*.app.tar.gz` (fonte do updater).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          # Mesmo domínio de produção usado pelo deploy. Vem de secret: o default
          # bakeado no pacote tem de ser o servidor real do dono, não um placeholder.
          # Pode ser vazio de propósito (o app pede o servidor na 1ª abertura) —
          # o que não pode é um default quebrado; ver scripts/checar-api-base.mjs.
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Windows: tenta WiX (.msi); se o WiX falhar, cai para NSIS.
      - name: Build (Windows, MSI; NSIS se o WiX falhar)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles msi \
            || npx tauri build --target ${{ matrix.target }} --bundles nsis

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/**/release/bundle/**
            frontend/src-tauri/target/**/release/*.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Baixar todos os pacotes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artefatos
          merge-multiple: true

      - name: Montar o latest.json
        working-directory: frontend
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          node scripts/latest-json.mjs \
            --versao "$VERSAO" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$RELEASES_REPO" \
            --dir ../artefatos

      - name: Publicar no repositório público de releases
        # RELEASES_PAT: PAT clássico/fine-grained com acesso de escrita SOMENTE
        # ao repo fincontrol-releases (contents:write). Nunca reutilize um token
        # com acesso ao repo do código — este workflow publica artefatos públicos.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_PAT }}
          tag_name: ${{ github.ref_name }}
          name: FinControl ${{ github.ref_name }}
          draft: false
          # Tag com `-` (ex.: v1.2.2-rc.1) sai como pré-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            artefatos/**/*.dmg
            artefatos/**/*.msi
            artefatos/**/*-setup.exe
            artefatos/**/*.app.tar.gz
            artefatos/**/*.sig
            artefatos/latest.json
