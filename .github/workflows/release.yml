name: Release

# Binários assinados do app desktop. O código fica neste repo; os artefatos e o
# `latest.json` (consumido pelo updater) vão para o repo de releases.
# Dispara numa tag `v*` ou manualmente. NÃO republica uma tag existente por
# acidente: use workflow_dispatch apenas para uma versão nova.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes de tag simultâneos disputariam o latest.json — serializa por ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASES_REPO: devrafaelbrauner/fincontrol-releases
  # Mesmo domínio de produção usado pelo deploy. Vem de secret: o default
  # bakeado no pacote tem de ser o servidor real do dono, não um placeholder.
  # Pode ser vazio de propósito (o app pede o servidor na 1ª abertura) —
  # o que não pode é um default quebrado; ver scripts/checar-api-base.mjs.
  VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            # `app` gera o `*.app.tar.gz` (+ `.sig`) do updater; `dmg` instala.
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
    runs-on: ${{ matrix.os }}
    # A chave privada de assinatura do updater vive SÓ aqui (GitHub Secrets) e
    # SÓ neste job de build — o job `release` (que publica) nunca a vê.
    # A pubkey correspondente está no tauri.conf.json (minisign, válida).
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - run: npm ci

      # Backend embutido (sidecar): PyInstaller onedir em src-tauri/sidecar-dist/, que o
      # tauri.conf.json leva em bundle.resources. Precisa existir antes do `tauri build`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt

      - name: Build do backend (PyInstaller)
        working-directory: .
        shell: bash
        run: |
          python -m pip install -r backend/requirements-desktop.txt
          pyinstaller backend/desktop.spec --noconfirm --distpath frontend/src-tauri/sidecar-dist --workpath backend/build/pyinstaller

      # Smoke do executável congelado: sobe com segredos descartáveis (gerados aqui, nunca
      # um secret do repo), espera o /api/health e fecha o stdin, que deve encerrá-lo.
      - name: Smoke do backend (/api/health)
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          exe=frontend/src-tauri/sidecar-dist/fincontrol-backend/fincontrol-backend
          [ -f "$exe.exe" ] && exe="$exe.exe"
          porta=$(python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")
          dados=$(mktemp -d)
          command -v cygpath > /dev/null && dados=$(cygpath -m "$dados")  # Windows: caminho nativo para o .exe
          linha=$(python -c "import base64, json, os, secrets; print(json.dumps({'secret_key': secrets.token_hex(32), 'fernet_key': base64.urlsafe_b64encode(os.urandom(32)).decode(), 'token': secrets.token_hex(32)}))")
          # O stdin é um pipe que fica aberto até existir "$dados/fim" (sem FIFO: vale no Git Bash).
          trap 'touch "$dados/fim"' EXIT
          { echo "$linha"; while [ ! -f "$dados/fim" ]; do sleep 0.1; done; } \
            | { set +e; FINCONTROL_DATA="$dados/app-data" FINCONTROL_PORTA="$porta" FINCONTROL_AGENDADOR=0 FINCONTROL_MODO=desktop "$exe"; echo "$?" > "$dados/saiu"; } &
          inicio=$SECONDS
          until curl -fs "http://127.0.0.1:$porta/api/health" > "$dados/health"; do
            [ -f "$dados/saiu" ] && { echo "o backend saiu antes de ficar pronto"; exit 1; }
            [ $((SECONDS - inicio)) -ge 30 ] && { echo "/api/health não respondeu em 30 s"; exit 1; }
            sleep 0.2
          done
          grep -q '"ok":true' "$dados/health"
          echo "pronto em ~$((SECONDS - inicio)) s"
          touch "$dados/fim"  # fecha o stdin: o backend tem de sair em até 3 s
          for _ in $(seq 1 40); do [ -f "$dados/saiu" ] && break; sleep 0.1; done
          [ -f "$dados/saiu" ] || { echo "o backend não saiu com o EOF do stdin"; exit 1; }
          echo "sidecar ok: /api/health 200 e saída $(cat "$dados/saiu") com o EOF"

      # macOS: `.dmg` para instalar + `*.app.tar.gz` (fonte do updater).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Windows: tenta WiX (.msi); se o WiX falhar, cai para NSIS.
      - name: Build (Windows, MSI; NSIS se o WiX falhar)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles msi \
            || npx tauri build --target ${{ matrix.target }} --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/**/release/bundle/**
            frontend/src-tauri/target/**/release/*.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar todos os pacotes
        uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      - name: Montar o latest.json
        working-directory: frontend
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          node scripts/latest-json.mjs \
            --versao "$VERSAO" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$RELEASES_REPO" \
            --dir ../artefatos

      - name: Publicar no repositório público de releases
        # RELEASES_PAT: PAT clássico/fine-grained com acesso de escrita SOMENTE
        # ao repo fincontrol-releases (contents:write). Nunca reutilize um token
        # com acesso ao repo do código — este workflow publica artefatos públicos.
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_PAT }}
          tag_name: ${{ github.ref_name }}
          name: FinControl ${{ github.ref_name }}
          draft: false
          # Tag com `-` (ex.: v1.2.2-rc.1) sai como pré-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            artefatos/**/*.dmg
            artefatos/**/*.msi
            artefatos/**/*-setup.exe
            artefatos/**/*.app.tar.gz
            artefatos/**/*.sig
            artefatos/latest.json
