name: Wheels Android (pydantic-core)

# Wheels Android do pydantic-core para o sabor `local` do APK (Chaquopy, Python 3.13).
# O índice do Chaquopy não tem pydantic-core para 3.13, e o pip do Chaquopy 17 só aceita
# wheel (--only-binary): elas são construídas aqui, a partir do sdist conferido por hash.
#
# Manual. O push que altera ESTE arquivo também dispara, porque o GitHub só mostra o
# "Run workflow" de arquivos que já estão na branch padrão.
# Não publica nada e não usa secrets: as wheels e o SHA256SUMS saem como artefato do run
# e são commitados à mão em frontend/android/app/wheels/ (`gh run download`).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/wheels-android.yml

permissions:
  contents: read

concurrency:
  group: wheels-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # O pydantic 2.14.2 fixa pydantic-core==2.50.2 (backend/requirements-android.txt).
  PYDANTIC_CORE_VERSION: "2.50.2"
  PYDANTIC_CORE_SDIST_URL: "https://files.pythonhosted.org/packages/af/8e/23ec1021834e35041fbb2f10946141e6acdfd39379c45cc4d65a4e8a1d98/pydantic_core-2.50.2.tar.gz"
  PYDANTIC_CORE_SDIST_SHA256: "1b0e8dc3932cf4e9ed5727570325cacc716b9409ffc794a221c0ccc72e8eb775"

jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: sdist do pydantic-core (sha256 conferido)
        run: |
          curl -fsSL -o "pydantic_core-${PYDANTIC_CORE_VERSION}.tar.gz" "$PYDANTIC_CORE_SDIST_URL"
          echo "${PYDANTIC_CORE_SDIST_SHA256}  pydantic_core-${PYDANTIC_CORE_VERSION}.tar.gz" | sha256sum -c -

      - name: cibuildwheel --platform android
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_BUILD_VERBOSITY: "1"
          # O rustc não lê LDFLAGS: o alinhamento de 16 KB (aparelhos com páginas de
          # 16 KB, Android 15+) vai explícito para o linker.
          CIBW_ENVIRONMENT_ANDROID: 'RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"'
          # Roda num emulador gerenciado pelo Gradle, da arquitetura do runner: aqui só a
          # wheel x86_64 é testada (o cibuildwheel pula a arm64). A arm64 é provada no
          # emulador arm64 de 16 KB do spike (S0.1).
          CIBW_TEST_COMMAND: >-
            python -c "import sys, pydantic_core as c;
            v = c.SchemaValidator(c.core_schema.int_schema());
            assert v.validate_python('42') == 42;
            print('pydantic_core', c.__version__, sys.platform)"
        run: |
          python -m pip install "cibuildwheel==4.3.5"
          python -m cibuildwheel --platform android --output-dir wheelhouse "pydantic_core-${PYDANTIC_CORE_VERSION}.tar.gz"

      - name: Segmentos LOAD alinhados a 16 KB
        run: |
          python - <<'FIM'
          import pathlib, struct, sys, zipfile

          ruins = []
          for whl in sorted(pathlib.Path("wheelhouse").glob("*.whl")):
              with zipfile.ZipFile(whl) as z:
                  for nome in (n for n in z.namelist() if n.endswith(".so")):
                      elf = z.read(nome)
                      if elf[:4] != b"\x7fELF" or elf[4] != 2:
                          sys.exit(f"{whl.name}:{nome} não é ELF64")
                      ordem = "<" if elf[5] == 1 else ">"
                      (phoff,) = struct.unpack_from(ordem + "Q", elf, 0x20)
                      phentsize, phnum = struct.unpack_from(ordem + "HH", elf, 0x36)
                      for i in range(phnum):
                          base = phoff + i * phentsize
                          (tipo,) = struct.unpack_from(ordem + "I", elf, base)
                          (alinhamento,) = struct.unpack_from(ordem + "Q", elf, base + 0x30)
                          if tipo == 1:  # PT_LOAD
                              print(f"{whl.name}:{nome} LOAD align=0x{alinhamento:x}")
                              if alinhamento % 16384:
                                  ruins.append(f"{whl.name}:{nome}=0x{alinhamento:x}")
          if ruins:
              sys.exit("LOAD fora de 16 KB: " + ", ".join(ruins))
          FIM

      - name: SHA256SUMS
        working-directory: wheelhouse
        run: sha256sum *.whl | tee SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-android-pydantic-core-2.50.2
          path: |
            wheelhouse/*.whl
            wheelhouse/SHA256SUMS
          if-no-files-found: error
